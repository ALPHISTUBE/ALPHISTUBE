  75.000% { transform: translateX(0.0px); animation-timing-function: steps(29, end); }
  83.333% { transform: translateX(377.0px); }
  95.139% { transform: translateX(377.0px); animation-timing-function: steps(29, end); }
  99.306% { transform: translateX(0.0px); }
  99.375%, 100% { transform: translateX(0.0px); }
}
@keyframes cursor3 {
  0%, 74.931% { transform: translateX(0.0px); opacity: 0; }
  75.000% { transform: translateX(0.0px); opacity: 1; animation-timing-function: steps(29, end); }
  83.333% { transform: translateX(377.0px); opacity: 1; }
  95.139% { transform: translateX(377.0px); opacity: 1; animation-timing-function: steps(29, end); }
  99.306% { transform: translateX(0.0px); opacity: 1; }
  99.375%, 100% { transform: translateX(0.0px); opacity: 0; }
}
.clip3 { animation: reveal3 14.4s infinite; }
.cur3 { opacity: 0; animation: cursor3 14.4s infinite; }
  @media (prefers-reduced-motion: reduce) { .rise, .spin, .pulse { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="url(#bg)" stroke="#30363d"/>
<rect x="760" y="1" width="439" height="298" fill="url(#dots)" opacity="0.7"/>

<circle cx="1010" cy="150" r="150" fill="url(#glow)" class="pulse"/>
<circle cx="1010" cy="150" r="58" fill="none" stroke="#30363d" stroke-dasharray="none"/>
<g class="spin" style="animation-duration:9s;animation-delay:-0.9s;">
  <circle cx="1068" cy="150" r="5" fill="url(#accent)"/>
</g>
<circle cx="1010" cy="150" r="92" fill="none" stroke="#30363d" stroke-dasharray="4 6"/>
<g class="spin" style="animation-duration:15s;animation-delay:-6.8s;animation-direction:reverse;">
  <circle cx="1102" cy="150" r="6" fill="url(#accent)"/>
</g>
<circle cx="1010" cy="150" r="126" fill="none" stroke="#30363d" stroke-dasharray="none"/>

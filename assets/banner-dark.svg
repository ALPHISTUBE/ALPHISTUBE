<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rafawat Sholaiman Alphi: Software Developer, Game Developer, Web &amp; Mobile Developer, ML &amp; Computer Vision Tinkerer">
<title>Rafawat Sholaiman Alphi</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
  </pattern>
</defs>
<style>
  .greet { font: 500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #8b949e; }
  .name { font: 800 56px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: -1px; }
  .role { font: 600 22px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #e6edf3; }
  .prompt { font: 600 22px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #22d3ee; }
  .rise { animation: rise .8s ease-out backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .spin { transform-origin: 1010px 150px; animation: spin linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pulse { transform-origin: 1010px 150px; animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  @keyframes reveal0 {
  0% { transform: translateX(0.0px); }
  0.000% { transform: translateX(0.0px); animation-timing-function: steps(18, end); }
  8.333% { transform: translateX(234.0px); }
  20.139% { transform: translateX(234.0px); animation-timing-function: steps(18, end); }
  24.306% { transform: translateX(0.0px); }
  24.375%, 100% { transform: translateX(0.0px); }
}
@keyframes cursor0 {
  0% { transform: translateX(0.0px); opacity: 0; }
  0.000% { transform: translateX(0.0px); opacity: 1; animation-timing-function: steps(18, end); }
  8.333% { transform: translateX(234.0px); opacity: 1; }
  20.139% { transform: translateX(234.0px); opacity: 1; animation-timing-function: steps(18, end); }
  24.306% { transform: translateX(0.0px); opacity: 1; }
  24.375%, 100% { transform: translateX(0.0px); opacity: 0; }
}
.clip0 { animation: reveal0 14.4s infinite; }
.cur0 { opacity: 0; animation: cursor0 14.4s infinite; }
  @keyframes reveal1 {
  0%, 24.931% { transform: translateX(0.0px); }

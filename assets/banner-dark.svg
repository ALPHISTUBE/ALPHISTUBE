  58.333% { transform: translateX(286.0px); }
  70.139% { transform: translateX(286.0px); animation-timing-function: steps(22, end); }
  74.306% { transform: translateX(0.0px); }
  74.375%, 100% { transform: translateX(0.0px); }
}
@keyframes cursor2 {
  0%, 49.931% { transform: translateX(0.0px); opacity: 0; }
  50.000% { transform: translateX(0.0px); opacity: 1; animation-timing-function: steps(22, end); }
  58.333% { transform: translateX(286.0px); opacity: 1; }
  70.139% { transform: translateX(286.0px); opacity: 1; animation-timing-function: steps(22, end); }
  74.306% { transform: translateX(0.0px); opacity: 1; }
  74.375%, 100% { transform: translateX(0.0px); opacity: 0; }
}
.clip2 { animation: reveal2 14.4s infinite; }
.cur2 { opacity: 0; animation: cursor2 14.4s infinite; }
  @keyframes reveal3 {

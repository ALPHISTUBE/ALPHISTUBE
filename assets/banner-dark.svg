  <circle cx="1136" cy="150" r="4" fill="url(#accent)"/>
</g>
<g transform="translate(1010 150)">
  <rect x="-30" y="-30" width="60" height="60" rx="16" fill="url(#accent)"/>
  <text x="0" y="9" text-anchor="middle" style="font: 700 26px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #ffffff;">&lt;/&gt;</text>
</g>

<g class="rise"><text x="64" y="104" class="greet">Hi there, I'm</text></g>
<g class="rise" style="animation-delay:.15s"><text x="62" y="168" class="name" fill="url(#accent)">Rafawat Sholaiman Alphi</text></g>
<g class="rise" style="animation-delay:.3s">
  <text x="34" y="214" class="prompt">›</text>
  <clipPath id="clip0"><rect class="clip0" x="-170" y="188" width="234" height="36"/></clipPath>
<text x="64" y="214" class="role" clip-path="url(#clip0)" textLength="234.0" lengthAdjust="spacing">Software Developer</text>
<rect class="cur0" x="66" y="194" width="3" height="26" rx="1" fill="#22d3ee"/>
  <clipPath id="clip1"><rect class="clip1" x="-118" y="188" width="182" height="36"/></clipPath>
<text x="64" y="214" class="role" clip-path="url(#clip1)" textLength="182.0" lengthAdjust="spacing">Game Developer</text>
<rect class="cur1" x="66" y="194" width="3" height="26" rx="1" fill="#22d3ee"/>
  <clipPath id="clip2"><rect class="clip2" x="-222" y="188" width="286" height="36"/></clipPath>
<text x="64" y="214" class="role" clip-path="url(#clip2)" textLength="286.0" lengthAdjust="spacing">Web &amp; Mobile Developer</text>
<rect class="cur2" x="66" y="194" width="3" height="26" rx="1" fill="#22d3ee"/>
  <clipPath id="clip3"><rect class="clip3" x="-313" y="188" width="377" height="36"/></clipPath>
<text x="64" y="214" class="role" clip-path="url(#clip3)" textLength="377.0" lengthAdjust="spacing">ML &amp; Computer Vision Tinkerer</text>
<rect class="cur3" x="66" y="194" width="3" height="26" rx="1" fill="#22d3ee"/>
</g>
<rect x="64" y="244" width="72" height="4" rx="2" fill="url(#accent)" class="rise" style="animation-delay:.45s"/>

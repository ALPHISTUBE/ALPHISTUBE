  49.306% { transform: translateX(0.0px); }
  49.375%, 100% { transform: translateX(0.0px); }
}
@keyframes cursor1 {
  0%, 24.931% { transform: translateX(0.0px); opacity: 0; }
  25.000% { transform: translateX(0.0px); opacity: 1; animation-timing-function: steps(14, end); }
  33.333% { transform: translateX(182.0px); opacity: 1; }
  45.139% { transform: translateX(182.0px); opacity: 1; animation-timing-function: steps(14, end); }
  49.306% { transform: translateX(0.0px); opacity: 1; }
  49.375%, 100% { transform: translateX(0.0px); opacity: 0; }
}
.clip1 { animation: reveal1 14.4s infinite; }
.cur1 { opacity: 0; animation: cursor1 14.4s infinite; }
  @keyframes reveal2 {
